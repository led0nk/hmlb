---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:0.52.667
          env:
            - name: WANTED_UID
              value: "1000"
            - name: WANTED_GID
              value: "1000"
            - name: HERMES_WEBUI_STATE_DIR
              value: "/home/hermeswebui/.hermes/webui"
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: HERMES_WEBUI_PASSWORD
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: OLLAMA_API_KEY
          ports:
            - name: http
              containerPort: 8787
          volumeMounts:
            - name: home
              mountPath: /home/hermeswebui/.hermes
            - name: config
              mountPath: /home/hermeswebui/.hermes/config.yaml
              subPath: config.yaml
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: hermes-home
        - name: config
          configMap:
            name: hermes-config
        - name: workspace
          emptyDir: {}
