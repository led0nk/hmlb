---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: config-init
          image: busybox:1.37
          command: ["sh", "-c", "cp /config/config.yaml /hermes-home/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: home
              mountPath: /hermes-home
        - name: agent-src
          image: alpine/git:v2.49.1
          env:
            - name: AGENT_TAG
              value: "v0.23.1"
          command: ["sh", "-c", "test -d /hermes-home/hermes-agent/.git || git clone --depth 1 --branch $AGENT_TAG https://github.com/NousResearch/hermes-agent /hermes-home/hermes-agent"]
          volumeMounts:
            - name: home
              mountPath: /hermes-home
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:0.52.667
          env:
            - name: WANTED_UID
              value: "1000"
            - name: WANTED_GID
              value: "1000"
            - name: HERMES_WEBUI_STATE_DIR
              value: "/home/hermeswebui/.hermes/webui"
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: HERMES_WEBUI_PASSWORD
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes
                  key: OLLAMA_API_KEY
            - name: HERMES_WEBUI_AUTO_INSTALL
              value: "1"
          ports:
            - name: http
              containerPort: 8787
          volumeMounts:
            - name: home
              mountPath: /home/hermeswebui/.hermes
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: hermes-home
        - name: config
          configMap:
            name: hermes-config
        - name: workspace
          emptyDir: {}
