---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |-
    model:
      default: "glm-5.3-flash"
      provider: "ollama-cloud"
    approvals:
      mode: manual
    memory:
      memory_enabled: false
      user_profile_enabled: false
    skills:
      creation_nudge_interval: 0
    terminal:
      backend: "local"
      cwd: "/workspace"
      timeout: 180
