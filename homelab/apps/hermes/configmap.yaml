---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |-
    model:
      default: "glm-5.3-flash"
      provider: "ollama-cloud"
    approvals:
      mode: manual
    secrets:
      command:
        enabled: true
        command: "printf 'OLLAMA_API_KEY=%s\\n' \"$(cat /mnt/secret-env/OLLAMA_API_KEY)\""
        helper_timeout_seconds: 3
    memory:
      memory_enabled: false
      user_profile_enabled: false
    skills:
      creation_nudge_interval: 0
    terminal:
      backend: "local"
      cwd: "/workspace"
      timeout: 180
