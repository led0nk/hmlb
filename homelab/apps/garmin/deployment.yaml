---
apiVersion: v1
kind: Namespace
metadata:
  name: garmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-exporter
  namespace: garmin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garmin-exporter
      app.kubernetes.io/instance: garmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garmin-exporter
        app.kubernetes.io/instance: garmin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garmin-exporter
          image: ghcr.io/barnes-c/garmin_exporter:2.0.1
          args:
            - --token-file=/data/garmin_token.json
          stdin: true
          stdinOnce: false
          env:
            - name: GARMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: garmin-exporter
                  key: username
            - name: GARMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: garmin-exporter
                  key: password
          ports:
            - name: metrics
              containerPort: 10045
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: token
              mountPath: /data
      volumes:
        - name: token
          persistentVolumeClaim:
            claimName: garmin-exporter-token
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: garmin-exporter
  namespace: garmin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: garmin-exporter
      app.kubernetes.io/instance: garmin
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 1h # NOTE: cache.ttl is 1h, longevity data not workouts
---
apiVersion: v1
kind: Pod
metadata:
  name: garmin-token-debug
  namespace: garmin
  labels:
    app.kubernetes.io/name: garmin-token-debug
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: debug
      image: busybox:stable
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 20m
          memory: 16Mi
      volumeMounts:
        - name: token
          mountPath: /data
  volumes:
    - name: token
      persistentVolumeClaim:
        claimName: garmin-exporter-token
