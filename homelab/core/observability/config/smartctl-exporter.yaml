---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smartctl-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: smartctl-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartctl-exporter
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: role
          operator: Equal
          value: storage-node
          effect: NoSchedule
      containers:
        - name: smartctl-exporter
          image: quay.io/prometheuscommunity/smartctl-exporter:v0.15.0
          # NOTE: needs raw device access - /dev hostPath, root, privileged
          securityContext:
            runAsUser: 0
            privileged: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 9633
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: smartctl-exporter
  namespace: observability
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  namespaceSelector: {}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15m # NOTE: smartctl polls devices per scrape - slow attributes, no point in 30s
