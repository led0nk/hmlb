---
clusterName: homelab
talosVersion: v1.13.12
kubernetesVersion: v1.36.3
endpoint: https://100.102.171.89:6443
allowSchedulingOnMasters: true
additionalApiServerCertSans:
  - homelab
cniConfig:
  name: none
patches:
  - |-
    machine:
      sysctls:
        net.ipv4.ip_unprivileged_port_start: "0"
  - |-
    machine:
      kernel:
        modules:
          - name: intel_rapl_common
          - name: intel_rapl_msr
  - |-
    cluster:
      proxy:
        disabled: true
  - |-
    machine:
      systemDiskEncryption:
        state:
          provider: luks2
          keys:
            - tpm: {}
              slot: 0
        ephemeral:
          provider: luks2
          keys:
            - static:
                passphrase: ${diskEncryption}
              slot: 0
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/local
            type: bind
            source: /var/local
            options:
              - bind
              - rshared
              - rw
controlPlane:
  talosImageURL: factory.talos.dev/installer-secureboot/e229284abd3c5ce9711acd20daf4ff70eb2455f9bc285c0390a1501196c5046d
  extensionServices:
    - name: tailscale
      environment:
        - TS_AUTHKEY=${tsAuth}

worker:
  talosImageURL: factory.talos.dev/installer-secureboot/e229284abd3c5ce9711acd20daf4ff70eb2455f9bc285c0390a1501196c5046d
  extensionServices:
    - name: tailscale
      environment:
        - TS_AUTHKEY=${tsAuth}

nodes:
  - hostname: worker2
    ipAddress: 192.168.178.210
    installDisk: /dev/nvme0n1
    controlPlane: false
    nodeLabels:
      node-role.kubernetes.io/worker: ""
  - hostname: worker1
    ipAddress: 192.168.178.216
    installDisk: /dev/nvme0n1
    controlPlane: false
  - hostname: storage1
    ipAddress: 192.168.178.215
    installDisk: /dev/nvme0n1
    controlPlane: true
    patches:
      - |-
        machine:
          sysctls:
            vm.nr_hugepages: "1024"
      - |-
        machine:
          nodeTaints:
            role: "storage-node:NoSchedule"
    nodeLabels:
      openebs.io/engine: mayastor
      role: "storage-node"
