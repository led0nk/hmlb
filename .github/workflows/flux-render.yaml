name: flux-render

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLATE_CACHE_DIR: ${{ github.workspace }}/.flate-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Restore flate chart cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.flate-cache
          key: flate-${{ runner.os }}-${{ runner.arch }}
          restore-keys: flate-${{ runner.os }}-${{ runner.arch }}-

      - name: Install tools (versions pinned in Makefile)
        run: make install-tools

      - name: Render status, post PR comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/flux-render.sh
